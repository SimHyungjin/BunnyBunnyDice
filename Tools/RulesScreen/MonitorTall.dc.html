<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":1180}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 0, held: false };
}
componentDidMount() {
this.timer = setInterval(() => {
if (!this.state.held) this.setState({ tab: (this.state.tab + 1) % 3 });
}, 5000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const tab = this.state.tab;
const on = 'background:#ff2d7a;color:#1a0a1f;border:2px solid #ff2d7a;box-shadow:0 0 12px rgba(255,45,122,.7);';
const off = 'background:transparent;color:#e9fbff;border:2px solid rgba(63,224,255,.6);';
const dotOn = 'width:26px;height:8px;border-radius:4px;background:#ff2d7a;box-shadow:0 0 8px #ff2d7a;';
const dotOff = 'width:8px;height:8px;border-radius:4px;background:rgba(63,224,255,.5);';
const pick = (i) => () => this.setState({ tab: i, held: true });
return {
show0: tab === 0, show1: tab === 1, show2: tab === 2,
tabStyle0: tab === 0 ? on : off, tabStyle1: tab === 1 ? on : off, tabStyle2: tab === 2 ? on : off,
dot0: tab === 0 ? dotOn : dotOff, dot1: tab === 1 ? dotOn : dotOff, dot2: tab === 2 ? dotOn : dotOff,
pick0: pick(0), pick1: pick(1), pick2: pick(2),
};
}
}
</script>
